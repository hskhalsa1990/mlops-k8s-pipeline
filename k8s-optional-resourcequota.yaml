# Optional: cap what the namespace can consume. Apply with
#   kubectl apply -n <namespace> -f k8s-optional-resourcequota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-api-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-api-defaults
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
