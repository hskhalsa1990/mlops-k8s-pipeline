# Only the API port is reachable; all other ingress to these pods is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-api-ingress
spec:
  podSelector:
    matchLabels:
      app: ml-api
  policyTypes: [Ingress]
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
