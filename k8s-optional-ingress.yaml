# Optional: apply manually after switching the Service to ClusterIP.
# Requires an ingress controller and cert-manager; replace host and issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [ml-api.example.com]
    secretName: ml-api-tls
  rules:
  - host: ml-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ml-api-service
            port:
              name: http
