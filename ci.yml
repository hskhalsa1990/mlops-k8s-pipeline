# GitHub Actions pipeline.
# IMPORTANT: GitHub only runs workflows stored at .github/workflows/ci.yml.
# This file is kept flat in the repository root for easy upload; see "Setup on GitHub" in README.md
# for how to place it there (GitHub web: Add file > Create new file > name it .github/workflows/ci.yml).
#
# Flow: lint/test + security checks -> train (accuracy gate) -> build image (GHCR) -> scan
#       -> staging -> production (manual approval through the "production" environment).
# Deploy jobs run only when the repository variable ENABLE_DEPLOY is "true".
#
# Secrets (Settings > Secrets and variables > Actions), only needed for deployment:
#   KUBECONFIG_B64   base64 -w0 kubeconfig   (add it to the staging and production environments)

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-train.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -ll predict.py train.py data_validation.py model_card.py check_docs.py check_metrics.py load_test.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory; remove this line to make known vulnerabilities block the pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
      - name: Validate manifests
        run: |
          ./kubeconform -strict -ignore-missing-schemas -summary \
            k8s-deployment.yaml k8s-hpa.yaml k8s-pdb.yaml k8s-networkpolicy.yaml \
            k8s-optional-ingress.yaml k8s-optional-networkpolicy-egress.yaml \
            k8s-optional-resourcequota.yaml \
            monitoring-servicemonitor.yaml monitoring-prometheusrule.yaml
      - name: Render kustomization
        run: kubectl kustomize . > /dev/null

  lint-shell-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy.sh
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  train:
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      MIN_ACCURACY: "0.80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-train.txt
      - run: python train.py
      - run: python check_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            metrics.txt
            metrics.json

  build-image:
    runs-on: ubuntu-latest
    needs: [train, sast, secret-scan, validate-manifests, lint-shell-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model
      - name: Image name (registry paths must be lowercase)
        id: ref
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.name }}:latest
            ${{ steps.ref.outputs.name }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}

  image-scan:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ vars.TRIVY_EXIT_CODE || '0' }}   # set the variable to 1 to block on HIGH/CRITICAL
      - name: Block on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-image, image-scan]
    if: vars.ENABLE_DEPLOY == 'true'
    environment: staging
    env:
      ENABLE_MONITORING: "true"   # needs the Prometheus Operator; set "false" otherwise
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - run: bash deploy.sh staging "${{ needs.build-image.outputs.image }}"

  # Manual approval: add "Required reviewers" to the "production" environment
  # (Settings > Environments > production). The job waits until a reviewer approves.
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    if: vars.ENABLE_DEPLOY == 'true'
    environment: production
    env:
      ENABLE_MONITORING: "true"
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - run: bash deploy.sh production "${{ needs.build-image.outputs.image }}"

  # Runs when you push a tag such as v1.0.0. The tagged commit must already have been built
  # by this workflow on main (the image is looked up by commit SHA).
  release:
    runs-on: ubuntu-latest
    needs: lint-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: ref
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.ref.outputs.name }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json
          generate_release_notes: true
